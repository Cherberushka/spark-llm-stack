# =============================================================================
# Spark LLM stack v3 — gateway + web layer
#
# Inference engines run NATIVE/on-host:
#   - vLLM :8000        Qwen3.8-27B NVFP4 + DFlash2   (docker, script 03)

#   - Ollama :11434     bge-m3 embeddings (systemd, script 02)
# This compose file adds:
#   - LiteLLM :4000     single OpenAI-compatible API, model switching by name
#   - Open WebUI        chat + admin panel (connects through LiteLLM)
#   - Caddy :443        HTTPS front door + routing
# =============================================================================
name: spark-llm-web

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: spark-litellm
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "2"]
    environment:
      - VLLM_API_KEY=${VLLM_API_KEY:?set VLLM_API_KEY in stack/.env}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in stack/.env}
      # Virtual keys / spend logs / the :8443 admin UI REQUIRE a Postgres DB:
      - DATABASE_URL=postgresql://llmadmin:${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD in stack/.env}@litellm-db:5432/litellm
      # Redis: shared rate-limit/budget/router state across workers:
      - REDIS_HOST=litellm-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${LITELLM_REDIS_PASSWORD:?set LITELLM_REDIS_PASSWORD in stack/.env}
    depends_on:
      litellm-db:
        condition: service_healthy
      litellm-redis:
        condition: service_healthy
    volumes:
      - ./litellm/config.yaml:/etc/litellm/config.yaml:ro
      - litellm-data:/app/data
    ports:
      - "4000:4000"          # LAN API for Pi / scripts / integrations (ufw-restricted)
    networks: [web]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  litellm-db:
    image: postgres:16-alpine
    container_name: spark-litellm-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=llmadmin
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
      - POSTGRES_DB=litellm
    ports:
      - "127.0.0.1:5432:5432"   # loopback only: host-orchestrator -> tasks DB
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    networks: [web]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmadmin -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  litellm-redis:
    image: redis:7-alpine
    container_name: spark-litellm-redis
    restart: unless-stopped
    environment:
      - LITELLM_REDIS_PASSWORD=${LITELLM_REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${LITELLM_REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    networks: [web]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$LITELLM_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      litellm:
        condition: service_healthy
    environment:
      # --- chat models come through the LiteLLM gateway (OpenAI API) ---
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      # --- Ollama chat connection off (gateway serves the models) ---
      - ENABLE_OLLAMA_API=false
      # --- RAG embeddings: bge-m3 via the gateway ---
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_EMBEDDING_MODEL=bge-m3
      - RAG_OPENAI_API_BASE_URL=http://litellm:4000/v1
      - RAG_OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      # --- branding / auth ---
      - WEBUI_NAME=${WEBUI_NAME:-Spark LLM}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}   # first registered user = admin
      - WEBUI_AUTH=true
      - ENABLE_VERSION_CHECK=false
    volumes:
      - open-webui-data:/app/backend/data
    networks: [web]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2
    container_name: spark-caddy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"   # LiteLLM admin UI (own origin; UI breaks under subpath)
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:443}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  web:
    driver: bridge

volumes:
  litellm-db-data:
  litellm-data:
  open-webui-data:
  caddy_data:
  caddy_config:
